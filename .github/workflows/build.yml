name: Build

# Runs on every push to main and on version tags (vX.Y.Z), plus a manual
# trigger from the Actions tab. Produces two artifacts per run:
#   - Runway-mac : the .dmg installer (Apple Silicon)
#   - Runway-win : the NSIS .exe installer (x64)
# Download from the workflow run's Artifacts panel after the run finishes.
#
# When the trigger is a `v*` tag (e.g. v10.1.2), a follow-up job also
# publishes a permanent GitHub Release with the two installers attached
# as release assets — same files, but the download link doesn't expire
# after 30 days like regular workflow artifacts do.
#
# Builds are unsigned for distribution (no Apple Developer ID or
# Windows code-signing cert). macOS uses ad-hoc signing so the app
# launches on Apple Silicon without "damaged" errors. First-launch
# Gatekeeper warning still appears — right-click → Open to bypass.
# Windows SmartScreen may also warn.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish_tag:
        description: 'Publish a release under this tag (e.g. v10.2.3). Leave blank to only build installers as 30-day artifacts.'
        required: false
        default: ''

jobs:
  build:
    strategy:
      # Don't cancel the other OS's build if one fails — useful when only
      # one platform has a problem and the other should still ship.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact-name: Runway-mac
            package-cmd: package
            output-glob: release/*.dmg
          - os: windows-latest
            artifact-name: Runway-win
            package-cmd: package:win
            output-glob: release/*.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Permanent signing (macOS): with the MAC_SIGN_P12 / MAC_SIGN_P12_PASSWORD
      # repository secrets set, every build is signed with the same self-made
      # certificate, so macOS keeps Runway's permissions (Screen & System
      # Audio Recording, Accessibility, Automation) across updates. Without
      # the secrets this step does nothing and builds stay ad-hoc signed.
      - name: Load signing certificate (macOS)
        if: runner.os == 'macOS'
        env:
          MAC_SIGN_P12: ${{ secrets.MAC_SIGN_P12 }}
          MAC_SIGN_P12_PASSWORD: ${{ secrets.MAC_SIGN_P12_PASSWORD }}
        run: |
          if [ -z "$MAC_SIGN_P12" ]; then echo "No signing certificate secret; builds stay ad-hoc signed."; exit 0; fi
          KC="$RUNNER_TEMP/runway-sign.keychain-db"
          KCPASS="$(openssl rand -hex 16)"
          echo "$MAC_SIGN_P12" | base64 --decode > "$RUNNER_TEMP/sign.p12"
          security create-keychain -p "$KCPASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPASS" "$KC"
          security import "$RUNNER_TEMP/sign.p12" -k "$KC" -P "$MAC_SIGN_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPASS" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          # Trust it for code signing on this build machine (best effort).
          security find-certificate -c "Runway Signing" -p "$KC" > "$RUNNER_TEMP/sign.pem" || true
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/sign.pem" || true
          rm -f "$RUNNER_TEMP/sign.p12"
          ID="$(security find-identity -p codesigning "$KC" | awk '/Runway Signing/ {print $2; exit}')"
          if [ -z "$ID" ]; then echo "::warning::Signing certificate didn't load; builds stay ad-hoc signed."; exit 0; fi
          echo "Signing identity: $ID"
          echo "MAC_SIGN_IDENTITY=$ID" >> "$GITHUB_ENV"

      - name: Build and package
        run: npm run ${{ matrix.package-cmd }}
        env:
          # electron-builder must not pick up the signing certificate itself
          # (it would enable hardened runtime); make-dmg.sh signs instead.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.output-glob }}
          if-no-files-found: error
          retention-days: 30

  release:
    # Publishes a permanent GitHub Release with both installers attached.
    # Two ways to trigger it:
    #   1. Push a `v*` tag  (git tag vX.Y.Z && git push origin vX.Y.Z)
    #   2. Manually run this workflow with a `publish_tag` input — the run
    #      creates the tag at the built commit and publishes. Lets an agent
    #      that can trigger workflows (but can't push tags) cut a release.
    # A plain push to main or a dispatch with a blank publish_tag only
    # builds artifacts — it does not publish.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_tag != '')
    runs-on: ubuntu-latest
    permissions:
      # Required for the default GITHUB_TOKEN to create / update releases.
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded files (debug)
        run: find artifacts -type f | sort

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # On a tag push, github.ref_name IS the tag. On a manual dispatch,
          # use the publish_tag input; action-gh-release creates that tag at
          # the built commit if it doesn't exist yet.
          name: Runway ${{ inputs.publish_tag || github.ref_name }}
          tag_name: ${{ inputs.publish_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          # Auto-generate release notes from commits since the previous tag.
          generate_release_notes: true
          # Attach both installers. The double-glob picks up whatever DMG
          # and EXE filenames electron-builder produced for this version.
          files: |
            artifacts/Runway-mac/*.dmg
            artifacts/Runway-win/*.exe
          fail_on_unmatched_files: true
