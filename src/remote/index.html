<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#06090d" />
  <title>Runway Remote</title>
  <link rel="icon" type="image/png" href="./icon.png" />
  <link rel="apple-touch-icon" href="./icon.png" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="stylesheet" href="./main.css" />
</head>
<body>
  <main id="app">
    <header class="hdr">
      <div class="hdr-row-top">
        <div class="hdr-left">
        <div class="hdr-brand">
        <!-- Same waveform → road mark used in the desktop TopBar. -->
        <svg class="hdr-mark" viewBox="0 0 783.556 648.039" fill="currentColor" aria-hidden="true">

          <rect x="374.431" y="526.52" width="34.557" height="113.16" rx="17.07" ry="17.07"/>
        </svg>
        <span class="hdr-wordmark">Runway</span>
        </div>
        <!-- Service name + status — stacked under the brand and pushed
             to the bottom of the left column so its baseline lines up
             with the Lock button at the bottom of the status column on
             the right. -->
        <div class="hdr-meta">
          <span class="hdr-name" id="serviceName">No service</span>
          <span class="hdr-status" id="serviceStatus">Idle</span>
        </div>
        </div>
        <div class="hdr-status-col">
          <div class="hdr-status-lights" id="hdrStatusLights">
            <span class="hdr-light" id="lightMidi" data-state="absent" title="MIDI">MIDI</span>
            <span class="hdr-light" id="lightPp" data-state="disabled" title="ProPresenter">Pro7</span>
            <span class="hdr-light" id="lightAudio" data-state="off" title="Audio">Audio</span>
          </div>
          <!-- Reconnect-only banner. The status lights cover "alive";
               this slides in only when the WebSocket drops, so the
               operator notices without normal-state clutter. -->
          <span class="hdr-conn" id="conn" hidden>connecting…</span>
          <div class="hdr-time" id="hdrTime"></div>
          <!-- Lock-now button. Only visible while unlocked (toggled by
               main.js). Sits under the status lights for one-handed
               thumb reach in the top-right corner. -->
          <button class="hdr-lock-btn" id="hdrLockBtn" type="button" aria-label="Lock now" title="Lock now" hidden>
            <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" stroke="none" aria-hidden="true">
              <path d="M12 1a5 5 0 0 0-5 5v4H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2h-2V6a5 5 0 0 0-5-5zm-3 9V6a3 3 0 1 1 6 0v4H9z"/>
            </svg>
            <span class="hdr-lock-label">Lock</span>
          </button>
        </div>
      </div>
    </header>

    <section class="timer-wrap" id="timerWrap">
      <div class="timer-label" id="timerLabel">Service starts in</div>
      <div class="timer" id="timer">—:—:—</div>
      <div class="timer-meta" id="timerMeta"></div>
    </section>

    <section class="midi-monitor" id="midiMonitor" hidden>
      <div class="mm-head">
        <span class="mm-title">MIDI Activity</span>
        <div class="mm-head-actions">
          <button class="mm-clear" id="midiClear" type="button" title="Wipe the activity log">Clear</button>
          <button class="mm-view-all" id="midiViewAll" type="button">View all</button>
        </div>
      </div>
      <div class="mm-recent" id="midiRecent"></div>
    </section>

    <section class="now-playing" id="nowPlayingWrap" hidden>
      <img class="np-art" id="npArt" alt="" hidden />
      <div class="np-art-placeholder" id="npArtPlaceholder" aria-hidden>♪</div>
      <div class="np-text">
        <div class="np-label">Now playing</div>
        <div class="np-title" id="npTitle">—</div>
        <div class="np-pos" id="npPos">0:00 / 0:00</div>
        <div class="np-next" id="npNextWrap" hidden>
          <span class="np-next-label">Up next</span>
          <span class="np-next-title" id="npNext">—</span>
        </div>
      </div>
    </section>

    <!-- Locked footer. On phones (narrow viewport) it's a swipe-to-
         unlock track. On wider screens (laptop browser) it's a single
         button — the swipe gesture is awkward with a mouse. CSS @media
         flips between the two. -->
    <footer class="lock-bar" id="lockBar">
      <div class="swipe-track" id="swipeTrack">
        <div class="swipe-fill" id="swipeFill"></div>
        <span class="swipe-text" id="swipeText">Swipe to unlock</span>
        <div class="swipe-thumb" id="swipeThumb" aria-label="Swipe right to unlock">›</div>
      </div>
      <button class="wide-unlock-btn" id="wideUnlockBtn" type="button">
        <!-- Audio-wave progress. Path animates continuously (looks like
             a live waveform) and the whole layer is clip-path-revealed
             left-to-right as the user holds — duration set by JS to
             match HOLD_MS. -->
        <span class="wide-unlock-wave" id="wideUnlockFill" aria-hidden="true">
          <!-- Rounded vertical audio-meter bars. main.js fills the SVG
               with 120 rects across 6 repeats of a 20-bar height
               pattern; the whole SVG translates -100 user units per
               keyframe cycle so the bars appear to scroll left while
               the heights stay self-similar (seamless loop). -->
          <svg id="wideUnlockBars" viewBox="0 0 400 60" preserveAspectRatio="none"></svg>
        </span>
        <span class="wide-unlock-inner">
          <svg class="wide-unlock-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="11" width="18" height="11" rx="2" />
            <path d="M7 11V7a5 5 0 0 1 9.9-1" />
          </svg>
          <span id="wideUnlockLabel">Hold to unlock</span>
        </span>
      </button>
      <!-- "Sign out completely" — clears the cached PIN so the phone
           stops auto-unlocking on reconnect. Useful when switching
           between operator and viewer roles, or after rotating PINs
           on the desktop. Only rendered when there's actually a
           cached PIN to forget (toggled by main.js). -->
      <button class="forget-pin-btn" id="forgetPinBtn" type="button" hidden>
        Forget saved PIN
      </button>
    </footer>

    <!-- Unlocked: action grid. Hidden until auth succeeds. -->
    <footer class="action-bar" id="actionBar" hidden>
      <!-- Time-shift row: small light-grey ±2 min buttons. Two-step
           confirm — first tap arms (red flash), second tap commits.
           Mirrors the desktop time-shift buttons. -->
      <div class="time-shift-row">
        <button class="time-shift-mini" data-cmd="extend_forward" data-confirm="false" id="extendForwardBtn">−2 min</button>
        <button class="time-shift-mini" data-cmd="extend_back" data-confirm="false" id="extendBackBtn">+2 min</button>
      </div>
      <div class="master-vol-row">
        <button class="master-vol-mute" id="masterMuteBtn" type="button" aria-label="Mute master">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor" />
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07" id="masterVolWave1" />
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14" id="masterVolWave2" />
          </svg>
        </button>
        <input class="master-vol-slider" id="masterVolSlider" type="range" min="0" max="100" step="1" value="100" aria-label="Master volume" />
        <span class="master-vol-pct" id="masterVolPct">100%</span>
      </div>
      <div class="action-grid">
        <button class="action-btn" id="armBtn" data-cmd="arm_toggle">
          <svg class="action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />
          </svg>
          <span class="action-label" id="armLabel">Arm</span>
        </button>
        <!-- Post-service slot. While idle: single Post-Service button.
             While rolling: a 3-segment Prev / Stop / Next group sharing
             the same grid cell so the operator can step through the
             post-service tracks from the phone. -->
        <button class="action-btn" id="postServiceBtn" data-cmd="start_post_service">
          <svg class="action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polygon points="5 4 15 12 5 20 5 4" fill="currentColor" />
            <line x1="19" y1="5" x2="19" y2="19" />
          </svg>
          <span class="action-label">Post-Service</span>
        </button>
        <div class="action-btn post-transport" id="postTransport" hidden>
          <button class="post-transport-btn" data-cmd="prev_track" aria-label="Previous track">
            <svg viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true">
              <polygon points="20 5 9 12 20 19 20 5" />
              <rect x="5" y="5" width="2" height="14" rx="1" />
            </svg>
          </button>
          <button class="post-transport-btn" data-cmd="next_track" aria-label="Next track">
            <svg viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true">
              <polygon points="4 5 15 12 4 19 4 5" />
              <rect x="17" y="5" width="2" height="14" rx="1" />
            </svg>
          </button>
        </div>
        <button class="action-btn" id="padBtn" data-cmd="pad_play">
          <svg class="action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 12 Q5 6 7 12 T11 12 T15 12 T19 12 T23 12" />
            <line x1="3" y1="18" x2="23" y2="18" stroke-opacity="0.3" />
          </svg>
          <span class="action-label" id="padLabel">Pad Play</span>
          <span class="action-pad-key" id="padArmedKeyChip" hidden></span>
          <!-- A span (not a button) — nested <button>s are invalid HTML and
               browsers silently relocate the inner one out of view. We
               wire its tap-target via JS and keep the parent's click
               handler from double-firing via a target.closest() guard. -->
          <span class="pad-key-pick" id="padKeyPickBtn" role="button" tabindex="0" aria-label="Choose pad key" title="Choose pad key">▾</span>
        </button>
        <button class="action-btn action-btn-fade-to-pad" data-cmd="fade_to_pad" id="fadeToPadBtn">
          <svg class="action-icon" id="fadeToPadIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 12 Q5 6 7 12 T11 12 T15 12 T19 12 T23 12" />
            <path d="M16 6l4 4-4 4" />
          </svg>
          <span class="action-label" id="fadeToPadLabel">Fade to Pad</span>
        </button>
      </div>
      <!-- Pre-service-only mini row. Hidden unless a service is armed
           AND music hasn't started yet (= phase==='queued'). Smaller
           buttons since Music Early and Shuffle are setup operations
           the operator hits before the runway fires, not during a live
           service. -->
      <div class="action-mini-grid" id="miniActions" hidden>
        <button class="action-btn action-btn-mini" data-cmd="start_music_early">
          <svg class="action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polygon points="6 4 20 12 6 20 6 4" fill="currentColor" />
          </svg>
          <span class="action-label">Music Early</span>
        </button>
        <button class="action-btn action-btn-mini" data-cmd="shuffle">
          <svg class="action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="16 3 21 3 21 8" />
            <line x1="4" y1="20" x2="21" y2="3" />
            <polyline points="21 16 21 21 16 21" />
            <line x1="15" y1="15" x2="21" y2="21" />
            <line x1="4" y1="4" x2="9" y2="9" />
          </svg>
          <span class="action-label">Shuffle</span>
        </button>
      </div>
      <!-- Stop All on its own row spanning the full width so it always
           reads as a "panic stop", visually separate from the routine
           transport buttons above. Second tap is required to fire — see
           the confirm-stop pattern in main.js. -->
      <button class="action-btn action-btn-danger action-btn-wide" id="stopAllBtn" data-cmd="panic">
        <svg class="action-icon" viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true">
          <rect x="5" y="5" width="14" height="14" rx="2" />
        </svg>
        <span class="action-label" id="stopAllLabel">Stop All</span>
      </button>
    </footer>

    <!-- PIN entry overlay. Shown after press-and-hold completes. -->
    <div class="pin-overlay" id="pinOverlay" hidden>
      <div class="pin-card">
        <div class="pin-title">Enter PIN</div>
        <div class="pin-dots" id="pinDots">
          <span class="pin-dot"></span>
          <span class="pin-dot"></span>
          <span class="pin-dot"></span>
          <span class="pin-dot"></span>
        </div>
        <div class="pin-error" id="pinError"></div>
        <div class="pin-keypad">
          <button class="pin-key" data-d="1">1</button>
          <button class="pin-key" data-d="2">2</button>
          <button class="pin-key" data-d="3">3</button>
          <button class="pin-key" data-d="4">4</button>
          <button class="pin-key" data-d="5">5</button>
          <button class="pin-key" data-d="6">6</button>
          <button class="pin-key" data-d="7">7</button>
          <button class="pin-key" data-d="8">8</button>
          <button class="pin-key" data-d="9">9</button>
          <button class="pin-key pin-key-blank" data-d="cancel">Cancel</button>
          <button class="pin-key" data-d="0">0</button>
          <button class="pin-key pin-key-blank" data-d="back">⌫</button>
        </div>
      </div>
    </div>

    <!-- Pad key picker overlay. Tapping a key sets padArmedKey on the
         desktop; doesn't fire the pad — operator hits Pad Play after.
         Shown over the action bar; tap the backdrop to dismiss. -->
    <div class="pad-key-overlay" id="padKeyOverlay" hidden>
      <div class="pad-key-card">
        <div class="pad-key-head">
          <span class="pad-key-title">Pad key</span>
          <button class="pad-key-close" id="padKeyClose" type="button">Done</button>
        </div>
        <div class="pad-key-grid" id="padKeyGrid">
          <!-- Populated by main.js with the 12 musical keys. Buttons
               disabled when no pad is mapped to that key. -->
        </div>
      </div>
    </div>

    <!-- MIDI monitor full-screen overlay (View all). -->
    <div class="midi-overlay" id="midiOverlay" hidden>
      <div class="midi-overlay-card">
        <div class="midi-overlay-head">
          <span class="midi-overlay-title">MIDI Activity</span>
          <div class="midi-overlay-actions">
            <button class="midi-overlay-clear" id="midiClearOverlay" type="button" title="Wipe the activity log">Clear</button>
            <button class="midi-overlay-close" id="midiClose" type="button">Done</button>
          </div>
        </div>
        <div class="midi-overlay-list" id="midiAll"></div>
      </div>
    </div>
  </main>
  <script src="./main.js"></script>
</body>
</html>
