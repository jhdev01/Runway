<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Runway · Changelog</title>
<style>
  :root {
    --bg: #0d1117;
    --bg-elev: #161b22;
    --border: #20262e;
    --border-strong: #2d3748;
    --text: #e6edf3;
    --text-dim: #9ca3af;
    --text-faint: #6b7280;
    --accent: #14b8a6;
    --accent-bright: #67e8f9;
    --amber: #fbbf24;
    --pink: hsl(300, 68%, 75%);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: linear-gradient(180deg, #050708 0%, #0d1117 100%);
    background-attachment: fixed;
    color: var(--text);
    font-family: -apple-system, system-ui, 'SF Pro Text', 'Segoe UI', sans-serif;
    line-height: 1.55;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 56px 28px 96px; }
  header { margin-bottom: 36px; }
  h1 {
    font-family: -apple-system, system-ui, 'SF Pro Display', sans-serif;
    font-size: 34px; margin: 0 0 6px; font-weight: 700; letter-spacing: -0.02em;
  }
  h1 .accent { color: var(--accent-bright); }
  .tagline { color: var(--text-dim); font-size: 14px; margin: 0; }
  .release {
    margin: 22px 0;
    padding: 18px 22px;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 10px;
  }
  .release.major {
    border-left: 3px solid var(--accent);
    padding-left: 19px;
  }
  .release-head {
    display: flex; align-items: baseline; gap: 14px; margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .ver {
    font-family: 'IBM Plex Mono', 'SF Mono', ui-monospace, monospace;
    font-size: 16px; font-weight: 700; color: var(--accent-bright);
    letter-spacing: -0.01em;
  }
  .release.major .ver { font-size: 19px; }
  .date { font-size: 11px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.08em; }
  .badge {
    font-size: 10px; font-weight: 600; letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 2px 8px; border-radius: 99px;
    background: rgba(20, 184, 166, 0.15);
    color: var(--accent-bright);
    border: 1px solid rgba(20, 184, 166, 0.4);
  }
  ul { margin: 4px 0 0; padding-left: 20px; }
  li { margin: 5px 0; color: var(--text-dim); font-size: 14px; }
  li strong { color: var(--text); font-weight: 600; }
  footer {
    margin-top: 56px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
    color: var(--text-faint);
    font-size: 12px;
    text-align: center;
    letter-spacing: 0.04em;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Runway <span class="accent">changelog</span></h1>
    <p class="tagline">Worship audio control — what changed, when.</p>
  </header>
  <div id="releases"></div>
  <footer>Runway · pre-release · <a href="https://groundedlabs.dev" target="_blank" rel="noopener" style="color:inherit;text-decoration:underline">Grounded Labs Dev</a></footer>
</div>
<script>
// Inline version data — fewer moving parts than a separate JSON fetch and
// makes the page work as a standalone file:// load. Newest first.
const RELEASES = [
  {
    "version": "10.2.5",
    "date": "September 6, 2026",
    "major": false,
    "changes": [
      "<strong>ProPresenter triggers are now reorder-proof.</strong> Playlist-item actions used to fire by saved position, so reordering a playlist in ProPresenter silently fired the wrong slide while PP still reported success (seen Sep 6 on the prayer-to-post-service cue). The trigger now looks the item up by its saved name at fire time and uses its current position, falling back to the saved position if the name isn't found — and logs exactly what fired. Also: ProPresenter <em>failures</em> now reach timing.log (previously only successes were recorded, so a rejected trigger was invisible)."
    ]
  },
  {
    "version": "10.2.4",
    "date": "August 9, 2026",
    "major": false,
    "changes": [
      "Housekeeping — refreshed the About page and trimmed this changelog down to the major features and fixes. Carries the same between-service landing fix as 10.2.3; no functional change from it."
    ]
  },
  {
    "version": "10.2.3",
    "date": "August 9, 2026",
    "major": false,
    "changes": [
      "Fixed a rare <strong>between-service overshoot</strong>. When the auto-fill had to trim more than the entire first song off the front to fit the window, that song was left in the runway (playing zero audio) and the music ran long — overshooting the next service start, so the failsafe cut the music and the pad bridge got buried under it. Now songs the trim would fully skip are dropped from the runway and the leftover trim carries onto the next song, so the music lands on time and the pad is heard cleanly. Added a safety net in the playback walk so an oversized front-trim can never overshoot again."
    ]
  },
  {
    "version": "10.2.2",
    "date": "July 13, 2026",
    "major": false,
    "changes": [
      "Add-a-song now <strong>matches the service's landing key</strong>. When you tap +2 (or + Song) to fill time, the added song targets the key the service actually lands in — not whatever pad happened to be armed — so the handoff into the pad bridge stays in-key. Camelot-compatible keys still count, so e.g. a C song still qualifies for a G landing when no exact-key song is loaded."
    ]
  },
  {
    "version": "10.2.1",
    "date": "July 12, 2026",
    "major": true,
    "changes": [
      "<strong>+2 min now adds a song, not just time.</strong> Pressing +2 during pre-service both pushes the service start out 2 minutes AND drops in a key-matched song to fill it, fading to silence exactly at the new start — so the extra time is music, not a longer pad hold. A standalone <strong>+ Song</strong> button (and a MIDI-bindable action) adds a filling song without moving the start.",
      "Fixed the <strong>Sunday landing drift and the rare \"two songs at once.\"</strong> Root-caused the back-to-back-service audio issues: a music-bus claim token stops stale/interleaved starts from stranding untracked audio, Stop All (panic) now sweeps every source as a safety net, and decode latency is compensated so the runway lands on its marker instead of 5-15s late.",
      "Post-service <strong>\"Music fires in\" now shows the real time.</strong> During the between-services prayer, the countdown and \"Auto-arm scheduled for\" banner previously showed the normal auto-arm clock; they now show when the fill action actually arms the next service's music.",
      "<strong>Look-ahead pre-warm.</strong> The between-service music fill decodes its songs ~30s ahead of firing, removing the cold-start silence gap on the handoff.",
      "<strong>Timing log to disk.</strong> Service-timing diagnostics now also append to <code>timing.log</code> next to your config (Settings → Engine → Open timing log), so a service can be diagnosed after the fact without DevTools open.",
      "New: <strong>Planning Center integration</strong> (optional, off by default). Reads the first song of your upcoming plan and auto-sets the pad-bridge key, so it's right even when nobody sets it manually. Set it up under Settings → Planning Center."
    ]
  },
  {
    "version": "10.2.0",
    "date": "June 22, 2026",
    "major": false,
    "changes": [
      "<strong>Failsafe watchdogs</strong> for service timing: independent wall-clock backstops force the pad bridge and the service-start transition even if a controller tick is missed, so a service can't stall on silence. Plus verbose timing diagnostics behind the scenes for after-the-fact analysis."
    ]
  },
  {
    "version": "0.9.14",
    "date": "May 13, 2026",
    "major": true,
    "changes": [
      "<strong>Sample-accurate pre-service timing.</strong> Web Audio now commits every track start, stop, and crossfade to the clock up front, so a 30-minute pre-service playlist lands within ~1 second of service start — down from 45–55 seconds of drift."
    ]
  },
  {
    "version": "0.9.11",
    "date": "May 11, 2026",
    "major": true,
    "changes": [
      "<strong>Windows build now available</strong>, alongside Mac.",
      "<strong>Close-to-tray on Mac:</strong> the red close button hides Runway to the menu bar with a live countdown; quit from the tray menu (or ⌘Q) to actually exit. Timing stays accurate while hidden."
    ]
  },
  {
    "version": "0.9.6",
    "date": "May 9, 2026",
    "major": false,
    "changes": [
      "<strong>Fade to Pad.</strong> One tap fades the music to silence and brings up a key-matched pad to hold the room; tap again to bring the music back — no fader-riding to recover."
    ]
  },
  {
    "version": "0.9.2",
    "date": "May 8, 2026",
    "major": false,
    "changes": [
      "Fixed: <strong>between back-to-back services the previous pad bridge could play indefinitely.</strong> Auto-arm now waits while any audio is still rolling and silences leftover audio before arming the next service."
    ]
  },
  {
    "version": "0.9.1",
    "date": "May 8, 2026",
    "major": false,
    "changes": [
      "<strong>Phone remote installs as a home-screen app.</strong> \"Add to Home Screen\" produces a standalone remote that resists the tab-suspension that used to disconnect it on lock."
    ]
  },
  {
    "version": "0.8.2",
    "date": "May 7, 2026",
    "major": true,
    "changes": [
      "<strong>Library — new top-level tab.</strong> A central pool of every imported track with search, album artwork, and metadata; upload audio files directly from the toolbar."
    ]
  },
  {
    "version": "0.8.0",
    "date": "May 7, 2026",
    "major": true,
    "changes": [
      "<strong>Action Sequences — major new feature.</strong> A reusable library of timed automations that fire at set points in a runway: arm the next service, swap playlists between services, and trigger ProPresenter slides — with per-service overrides."
    ]
  },
  {
    "version": "0.6.0",
    "date": "May 2, 2026",
    "major": false,
    "changes": [
      "<strong>Backup &amp; restore.</strong> Export or import the full app config — services, playlists, library references, and settings — in one file."
    ]
  },
  {
    "version": "0.5.0",
    "date": "April 1, 2026",
    "major": true,
    "changes": [
      "<strong>ProPresenter integration.</strong> Network API timer sync so the pre-service countdown drives ProPresenter's on-stage timer, with lifecycle hooks to trigger slides when music starts, when the service begins, or on disarm.",
      "MTC (MIDI Time Code) output added for ProPresenter and other timecode-aware gear."
    ]
  },
  {
    "version": "0.4.0",
    "date": "March 10, 2026",
    "major": true,
    "changes": [
      "<strong>Pad Player.</strong> Key-aware sustained pads that bridge between the end of pre-service music and live worship, so the room never falls into silence at service start."
    ]
  },
  {
    "version": "0.3.2",
    "date": "February 26, 2026",
    "major": true,
    "changes": [
      "<strong>Land-in-key arrangement.</strong> The runway orders tracks so the final pre-service song lands in your service's first-song key."
    ]
  },
  {
    "version": "0.3.0",
    "date": "February 12, 2026",
    "major": false,
    "changes": [
      "<strong>Service scheduling.</strong> Weekly and one-off services with calculated start times."
    ]
  },
  {
    "version": "0.2.0",
    "date": "January 18, 2026",
    "major": true,
    "changes": [
      "<strong>Key-aware playlists.</strong> Camelot-wheel-aware track ordering for smooth harmonic transitions — no more clashing key changes between songs."
    ]
  },
  {
    "version": "0.1.0",
    "date": "December 15, 2025",
    "major": false,
    "changes": [
      "<strong>Initial release.</strong> Scheduled audio playback for worship pre-service."
    ]
  }
];

const root = document.getElementById('releases');
for (const r of RELEASES) {
  const article = document.createElement('article');
  article.className = 'release' + (r.major ? ' major' : '');
  const head = document.createElement('div');
  head.className = 'release-head';
  const verSpan = document.createElement('span');
  verSpan.className = 'ver';
  verSpan.textContent = 'v' + r.version;
  const dateSpan = document.createElement('span');
  dateSpan.className = 'date';
  dateSpan.textContent = r.date;
  head.appendChild(verSpan);
  head.appendChild(dateSpan);
  if (r.major) {
    const badge = document.createElement('span');
    badge.className = 'badge';
    badge.textContent = 'milestone';
    head.appendChild(badge);
  }
  const ul = document.createElement('ul');
  for (const item of r.changes) {
    const li = document.createElement('li');
    li.innerHTML = item;
    ul.appendChild(li);
  }
  article.appendChild(head);
  article.appendChild(ul);
  root.appendChild(article);
}
</script>
</body>
</html>
