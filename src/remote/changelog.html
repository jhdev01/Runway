<html lang="en">
<head>
<meta charset="utf-8">

<title>Runway · Changelog</title>
<style>
  :root {
    --bg: #0d1117;
    --bg-elev: #161b22;
    --border: #20262e;
    --border-strong: #2d3748;
    --text: #e6edf3;
    --text-dim: #9ca3af;
    --text-faint: #6b7280;
    --accent: #14b8a6;
    --accent-bright: #67e8f9;
    --amber: #fbbf24;
    --pink: hsl(300, 68%, 75%);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: linear-gradient(180deg, #050708 0%, #0d1117 100%);
    background-attachment: fixed;
    color: var(--text);
    font-family: -apple-system, system-ui, 'SF Pro Text', 'Segoe UI', sans-serif;
    line-height: 1.55;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 56px 28px 96px; }
  header { margin-bottom: 36px; }
  h1 {
    font-family: -apple-system, system-ui, 'SF Pro Display', sans-serif;
    font-size: 34px; margin: 0 0 6px; font-weight: 700; letter-spacing: -0.02em;
  }
  h1 .accent { color: var(--accent-bright); }
  .tagline { color: var(--text-dim); font-size: 14px; margin: 0; }
  .release {
    margin: 22px 0;
    padding: 18px 22px;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 10px;
  }
  .release.major {
    border-left: 3px solid var(--accent);
    padding-left: 19px;
  }
  .release-head {
    display: flex; align-items: baseline; gap: 14px; margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .ver {
    font-family: 'IBM Plex Mono', 'SF Mono', ui-monospace, monospace;
    font-size: 16px; font-weight: 700; color: var(--accent-bright);
    letter-spacing: -0.01em;
  }
  .release.major .ver { font-size: 19px; }
  .date { font-size: 11px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.08em; }
  .badge {
    font-size: 10px; font-weight: 600; letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 2px 8px; border-radius: 99px;
    background: rgba(20, 184, 166, 0.15);
    color: var(--accent-bright);
    border: 1px solid rgba(20, 184, 166, 0.4);
  }
  ul { margin: 4px 0 0; padding-left: 20px; }
  li { margin: 5px 0; color: var(--text-dim); font-size: 14px; }
  li strong { color: var(--text); font-weight: 600; }
  footer {
    margin-top: 56px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
    color: var(--text-faint);
    font-size: 12px;
    text-align: center;
    letter-spacing: 0.04em;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Runway <span class="accent">changelog</span></h1>
    <p class="tagline">Worship audio control — what changed, when.</p>
  </header>
  <div id="releases"></div>
  <footer>Runway · pre-release · jhdev</footer>
</div>

  {

  {

      'Fixed the <strong>Sunday landing drift and the rare "two songs at once."</strong> Root-caused the back-to-back-service audio issues: a music-bus claim token stops stale/interleaved starts from stranding untracked audio, Stop All (panic) now sweeps every source as a safety net, and decode latency is compensated so the runway lands on its marker instead of 5-15s late.',

  },
  {
    version: '10.2.0', date: 'June 22, 2026', major: false,
    changes: [
      '<strong>Failsafe watchdogs</strong> for service timing: independent wall-clock backstops force the pad bridge and the service-start transition even if a controller tick is missed, so a service can\'t stall on silence. Plus verbose timing diagnostics behind the scenes for after-the-fact analysis.',
    ],
  },
  {
    version: '0.9.14', date: 'May 13, 2026', major: false,
    changes: [
      'Runway timing: <strong>Web Audio precise-scheduled pre-service runways</strong>. Pre-service playback now commits every track\'s start, stop, and crossfade gain ramp to the audio context\'s clock up front, so transitions land sample-accurately regardless of tick granularity or decode latency. Post-service and Quick Test still use the reactive path so skip/scrub work as before. End-to-end accuracy across a 30-minute pre-service playlist is now ~1 second (down from 45-55 seconds).',
      'Runway autoArrange: the <strong>auto-start target now behaves as a wall-clock lead window</strong>. Music fires exactly N minutes before service start AND lands on T=0. The playlist builder fills <em>targetSec + (N-1)*crossfadeSec</em> of audible content so crossfade overlap compresses wall-clock back to exactly targetSec.',
      'Runway: <strong>beginMusic now walks wall-clock</strong> instead of gapless audible content when computing skip-into-runway offsets. Arming close to service start (e.g. quick-test scenarios with autoStartTarget=30min) now lands the anchor on its marker instead of N*crossfade seconds late.',
      'Action sequences: <strong>runway truncation now works for per-service overrides</strong>. The "then swaps to" footer + truncated chip list previously only checked playlist.actionSequenceId; now it also picks up postActionSequenceIdOverride / preActionSequenceIdOverride, matching what the controller actually uses to dispatch actions.',

  {
    version: '0.9.13', date: 'May 12, 2026', major: false,
    changes: [
      'Runway timing: <strong>full rewrite of the auto-arrange + transition timing math</strong>. The auto-start target now behaves as a wall-clock lead window — music fires exactly that many seconds before service start AND lands at T=0. Specifically: (1) the auto-arrange playlist builder fills <em>targetSec + (N-1)×crossfadeSec</em> of audible content so crossfade overlaps compress wall-clock back to exactly targetSec; (2) the audio engine\'s crossfade transitions anchor to the previous track\'s pre-scheduled end (deterministic overlap regardless of decode latency); (3) armService awaits the buffer preloader before returning so transitions never wait on decode mid-runway; (4) beginMusic\'s skip-into-runway logic walks wall-clock, not gapless audible content, so arming close to service start lands correctly. End-to-end accuracy on a 30-min playlist is now within ~1 second.',
    ],
  },
  {
    version: '0.9.12', date: 'May 12, 2026', major: false,

    ],
  },
  {
    version: '0.9.11', date: 'May 11, 2026', major: false,
    changes: [
      'Mac: <strong>close-to-tray</strong>. Clicking the red close button now hides the window to the menu bar instead of quitting. The menu bar icon shows a live countdown (HH:MM:SS, matches the big clock) and a right-click menu with the upcoming service status, current now-playing track, and quick access to the next few services. Use <em>Quit Runway</em> from the tray menu (or ⌘Q) to actually exit. Runway keeps timing accurate while hidden — the renderer no longer throttles in the background.',
      'Settings → Backup: <strong>Reset to factory defaults</strong> button. Wipes the app config (services, playlists, hooks, settings) after a type-to-confirm "Erase Everything" prompt. Audio files in the library directory are preserved — only the config is cleared. Offers a backup export before wipe.',
      'Settings → Library: shows the audio library path with a <strong>View in Finder</strong> button. The old "Move to library" button is now labeled <em>Consolidate</em> for clarity.',
      'Windows build now available. Same feature set; tray icon uses the colored Runway icon since Windows does not auto-tint template images like macOS does.',
    ],

  {

    ],
  },
  {

      'Live view: <strong>compact action row</strong> — Start Post-Service / Fade to Pad / Stop All sit on one line at the bottom instead of the previous oversized 2-column grid. The Start Post-Service button has a small ▾ chevron in its corner that opens a playlist picker, mirroring the Pad-key gesture from the remote.',
      'Live view: countdown digits + "Music · Playing" pill recolored to the teal accent so the running-state visuals match the ARMED pill. Album art on the Now Playing card is clickable — opens a full-screen lightbox; click again to close. Same lightbox is wired to the Library mini-player\'s art too.',

      'Action engine: <strong>"after first song + N songs"</strong> with N equal to the playlist length now means "fire when the playlist finishes" instead of being silently skipped as out-of-bounds. Use case: a 2-song prayer playlist with an action that fires at the end of song 2 to arm the next service or swap to a different post-service playlist.',
      'arm_playlist with no upcoming service to arm against now <strong>falls back to a standalone playlist swap</strong> instead of bailing out silently — operators see music play and a one-line warning explaining why nothing was actually armed.',

      'Library: <strong>Show locations</strong> toggle expands rows to show on-disk paths (path tooltip on hover); <strong>always-visible folder indicator</strong> next to each row\'s tech info — filled = internal library, outlined = external reference; <strong>Consolidate library</strong> button copies every external file into the internal audio dir so the library is self-contained.',
      'Library: <strong>Refresh metadata refreshes only checked tracks</strong>. With nothing checked, click pops a transient hint instead of refreshing everything.',

      '<strong>Custom tooltip component</strong> replacing Electron\'s unreliable native title-attribute tooltips. Cursor-anchored bubble that follows the mouse, can\'t escape the viewport, and renders via portal so parent overflow/stacking can\'t hide it. Wired into action chips, runway markers, folder indicators, location paths, and a few other affordances.',
      'fade-to-pad: removed misleading <code>cursor: help</code> on action elements (showed <code>?</code> with no actual tooltip in Electron); cleared in favor of the new tooltip\'s default cursor.',

      '<strong>Panic to Pad → Fade to Pad</strong>, with toggle behavior. Click once to fade music to silence (the source keeps playing in the background so position stays accurate) and bring up a key-matched pad. Click again to bring music back and fade the pad out — no need to ride the master fader to recover. Renamed across desktop + remote; engaged state pulses pink, label flips to "Music Back In", the Now Playing label changes to "Holding on Pad".',
      'Library: <strong>album artwork picker.</strong> Click any track\'s thumbnail (or the ♪ placeholder) to open a popover with up to 8 candidate covers from iTunes — pick the right release when the auto-fill grabs the wrong version. Picking a candidate also fills the album name if the track was missing one.',
      'Library: <strong>auto-fill album names</strong> from iTunes alongside artwork. Tracks downloaded without ID3 album metadata now get the canonical "Song Title - Single" or full album name on Refresh metadata.',
      'Library: <strong>persistent now-playing dock</strong> at the bottom of the page when previewing a track. 56×56 art · title · artist · album · scrubber (click anywhere to seek) · stop button. Replaces the per-row scrubber. Click the art to open a full-screen lightbox of the cover.',

      'Library: Pad Player drawer no longer overlays the track list — the table shrinks to make room. The toggle button restyled to match the rest of the toolbar; click again to close.',
      'iTunes lookup: <strong>misses no longer cache</strong>. A transient network blip can no longer permanently brick a track\'s artwork — next Refresh metadata re-attempts.',
      'Library refresh metadata: <strong>preserves existing artwork</strong> if a fresh lookup comes back empty (was overwriting with blanks).',
    ],

  {
    version: '0.9.5', date: 'May 8, 2026', major: false,
    changes: [
      '<strong>Pad auto-tracks the current song\'s key.</strong> When music changes track, the pad\'s armed key updates to match — so hitting Pad Play (live or from the remote) fires a key-matched pad without stepping through the picker. Operator picks via the picker still win — auto-track only kicks in when the song key actually changes.',
      'Live + remote: <strong>Panic to Pad</strong>. Soft alternative to full panic — fades the music out and immediately brings up a key-matched pad so the room doesn\'t fall into silence. Pink button on Live, pink action button on the remote. Disabled when no music is playing or no pads are mapped.',

      'Remote: <strong>post-service swap to prev/stop/next.</strong> When post-service music is rolling, the Post-Service button transforms into a 3-segment transport — Prev track, Stop, Next track — sharing the same grid slot. Idle state still shows the single Post-Service start button.',

      'Remote: stable URL is now shown alongside the IP URL in Settings → Remote, and the QR code encodes it. Both phone and host need to be on the same Wi-Fi for mDNS to resolve.',

  {
    version: '0.9.2', date: 'May 8, 2026', major: false,
    changes: [
      'Fixed: <strong>between back-to-back services, the previous service\'s pad bridge played indefinitely.</strong> Auto-arm fired immediately when the prior service was marked completed (potentially 30+ minutes before the next service\'s music should begin), overwriting the previous runway and stranding the pad-fade-cleanup setTimeout (which keys on the runway\'s serviceId and bails when the runway swaps). Two-part fix: auto-arm now defers when ANY audio is currently rolling — post-service music, or a previous service\'s pad bridge — until <code>musicFireMs</code>. And when the deferred arm fires, it now explicitly fades both music AND pad before installing the new runway, so any leftover audio from the previous service is silenced.',
      'Settings → Remote: <strong>stable URL via mDNS.</strong> The first URL in the list is now the macOS-published <code>[hostname].local</code> address — survives DHCP IP changes on the host. Marked with a <em>STABLE</em> badge. The QR code now encodes this URL, so the PWA installed from it keeps working even after the router hands the Mac a new IP. (No new dependencies — macOS already publishes <code>.local</code> hostnames via Bonjour by default.)',
      'Playlists: clearer label on the toggle previously called "Play first song from start" — now reads <strong>"Don\'t trim opening song"</strong> with a one-line explanation underneath: "ON: music starts earlier so the first song plays from the beginning. OFF: starts mid-song to fit the lead window."',
    ],
  },
  {

const root = document.getElementById('releases');
for (const r of RELEASES) {
  const article = document.createElement('article');
  article.className = 'release' + (r.major ? ' major' : '');
  const head = document.createElement('div');
  head.className = 'release-head';
  const verSpan = document.createElement('span');
  verSpan.className = 'ver';
  verSpan.textContent = 'v' + r.version;
  const dateSpan = document.createElement('span');
  dateSpan.className = 'date';
  dateSpan.textContent = r.date;
  head.appendChild(verSpan);
  head.appendChild(dateSpan);
  if (r.major) {
    const badge = document.createElement('span');
    badge.className = 'badge';
    badge.textContent = 'milestone';
    head.appendChild(badge);
  }
  const ul = document.createElement('ul');
  for (const item of r.changes) {
    const li = document.createElement('li');
    li.innerHTML = item;
    ul.appendChild(li);
  }
  article.appendChild(head);
  article.appendChild(ul);
  root.appendChild(article);
}
