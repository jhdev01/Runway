<!--
  Runway — horizontal lockup.
  Mark on the left: an audio waveform that tapers down and flows into a
  clock face on the right (= audio resolving into a service-start moment).
  Wordmark: "Runway" in monospace.
  Uses currentColor so it inherits the surrounding text color; tint by
  setting `color: var(--accent-bright)` on the parent.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 56" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
  <!-- Tapering waveform: amplitude steps from 9 → 6 → 4 → 2 then a short flat lead-in -->
  <path
    d="M 4 28
       Q 10 19 16 28
       Q 22 37 28 28
       Q 33 22 38 28
       Q 43 34 48 28
       Q 52 25 56 28
       Q 60 31 64 28
       L 76 28"
    stroke-width="2.4"
  />
  <!-- Clock face -->
  <circle cx="98" cy="28" r="20" stroke-width="2.4" />
  <!-- 12-o'clock tick -->
  <line x1="98" y1="11" x2="98" y2="16" stroke-width="2.4" />
  <!-- Countdown hand (pointing up-right, T-minus 2 position) -->
  <line x1="98" y1="28" x2="106" y2="20" stroke-width="2.4" />

  <!-- Wordmark -->
  <g fill="currentColor" stroke="none" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-weight="600" font-size="22" letter-spacing="-0.2">
    <text x="128" y="35">Runway</text>
  </g>
</svg>
